<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
:root {
  --bg: #02070d;
  --panel: rgba(8, 28, 44, 0.55);
  --line: rgba(64, 200, 255, 0.22);
  --cyan: #3fd0ff;
  --cyan-soft: rgba(63, 208, 255, 0.55);
  --text: #cfeeff;
  --muted: #6d97ad;
  --gold: #ffb84d;
  --red: #ff5a6a;
  --green: #4dffb0;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(ellipse at 50% 35%, rgba(20, 90, 140, 0.25), transparent 60%),
    repeating-linear-gradient(0deg, rgba(63, 208, 255, 0.025) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(63, 208, 255, 0.025) 0 1px, transparent 1px 40px),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  grid-template-rows: 56px 1fr;
  height: 100vh;
  gap: 12px;
  padding: 12px;
}
header {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 20px;
  border-bottom: 1px solid var(--line);
  padding: 0 8px;
  letter-spacing: 0.12em;
}
.brand { font: 600 20px/1 var(--mono); color: var(--cyan); text-shadow: 0 0 12px var(--cyan-soft); }
.brand small { color: var(--muted); font-size: 11px; letter-spacing: 0.2em; margin-left: 10px; }
.status { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
.dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
.meters { margin-left: auto; display: flex; gap: 18px; font: 11px var(--mono); color: var(--muted); align-items: center; }
.meter { width: 90px; height: 4px; background: rgba(63,208,255,.12); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.meter i { display: block; height: 100%; width: 0; background: var(--cyan); transition: width .6s; }
#clock { font: 600 16px var(--mono); color: var(--text); }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  display: flex; flex-direction: column; min-height: 0;
}
.panel h2 {
  margin: 0; padding: 10px 14px; font: 600 11px var(--mono);
  letter-spacing: .25em; color: var(--cyan); border-bottom: 1px solid var(--line);
}
#agents { overflow-y: auto; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.agent {
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  font: 11px var(--mono); color: var(--muted); cursor: default;
  transition: all .25s; position: relative; overflow: hidden;
}
.agent b { display: block; color: var(--text); font-weight: 600; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent span::before { content: "standby"; }
.agent.active span::before { content: "engaged"; }
.agent.active { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px rgba(255,184,77,.35) inset; }
.agent.active b { color: var(--gold); }
.agent.active::after {
  content: ""; position: absolute; left: -40%; top: 0; bottom: 0; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255,184,77,.25), transparent);
  animation: sweep 1.1s linear infinite;
}
@keyframes sweep { to { left: 100%; } }
main { display: flex; flex-direction: column; min-height: 0; gap: 12px; }
.core { display: flex; justify-content: center; align-items: center; height: 230px; flex-shrink: 0; }
.reactor { position: relative; width: 210px; height: 210px; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
.r1 { border-top-color: var(--cyan); border-bottom-color: var(--cyan); animation: spin 9s linear infinite; box-shadow: 0 0 20px rgba(63,208,255,.25); }
.r2 { inset: 18px; border: 1px dashed var(--cyan-soft); animation: spin 22s linear infinite reverse; }
.r3 { inset: 36px; border-left-color: var(--cyan); border-right-color: var(--cyan); border-width: 3px; animation: spin 5s linear infinite; }
.r4 { inset: 56px; border: 1px solid var(--line); }
.heart {
  position: absolute; inset: 70px; border-radius: 50%;
  background: radial-gradient(circle, #e8fbff 0%, var(--cyan) 35%, rgba(63,208,255,.15) 70%, transparent 72%);
  box-shadow: 0 0 40px var(--cyan), 0 0 90px rgba(63,208,255,.4);
  animation: breathe 4s ease-in-out infinite;
}
.reactor.busy .r1 { animation-duration: 1.6s; }
.reactor.busy .r3 { animation-duration: 0.9s; }
.reactor.busy .heart { animation-duration: .8s; }
.reactor.listening .heart { background: radial-gradient(circle, #fff 0%, var(--gold) 35%, rgba(255,184,77,.15) 70%, transparent 72%); box-shadow: 0 0 40px var(--gold), 0 0 90px rgba(255,184,77,.4); }
.reactor-label { position: absolute; left: 0; right: 0; bottom: -26px; text-align: center; font: 11px var(--mono); letter-spacing: .3em; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(.88); opacity: .8; } }
#chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 9px 13px; border-radius: 10px; white-space: normal; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: rgba(63,208,255,.12); border: 1px solid var(--line); }
.msg.jarvis { align-self: flex-start; border-left: 2px solid var(--cyan); background: rgba(2,12,20,.6); }
.msg.system { align-self: center; font: 12px var(--mono); color: var(--gold); background: none; }
.msg pre { background: #01060b; border: 1px solid var(--line); padding: 8px; border-radius: 6px; overflow-x: auto; font: 12px var(--mono); }
.msg code { font-family: var(--mono); color: var(--cyan); }
.msg a { color: var(--cyan); }
.inputbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
#input {
  flex: 1; background: rgba(1,8,14,.8); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; font: 14px var(--sans); outline: none; resize: none; min-width: 0;
}
#input::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(63,208,255,.2); }
button {
  background: rgba(63,208,255,.1); color: var(--cyan); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 14px; font: 600 12px var(--mono); letter-spacing: .1em; cursor: pointer;
  min-height: 40px;
}
button:hover { border-color: var(--cyan); background: rgba(63,208,255,.2); }
button.on { color: var(--gold); border-color: var(--gold); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
#log { overflow-y: auto; padding: 8px 12px; font: 11px/1.55 var(--mono); color: var(--muted); flex: 1; }
#log div { padding: 3px 0; border-bottom: 1px dashed rgba(63,208,255,.08); word-break: break-word; }
#log .start { color: var(--gold); }
#log .end { color: var(--green); }
#log .tool { color: var(--cyan); }
#log .warn { color: var(--red); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.modal.show { display: flex; }
.modal .box { max-width: 520px; width: 100%; background: #04121d; border: 1px solid var(--gold); border-radius: 12px; padding: 18px; box-shadow: 0 0 30px rgba(255,184,77,.25); }
.modal h3 { margin: 0 0 8px; font: 600 13px var(--mono); letter-spacing: .2em; color: var(--gold); }
.modal p { font: 12px var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
#deny { color: var(--red); border-color: rgba(255,90,106,.4); }
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px auto 1fr auto; height: auto; min-height: 100vh; }
  .panel { min-width: 0; }
  body { overflow: auto; }
  .side-left #agents { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); max-height: 160px; }
  .side-right { max-height: 200px; }
  .core { height: 170px; }
  .reactor { transform: scale(.72); }
  main { min-height: 70vh; }
  .meters .m-extra { display: none; }
}
@media (max-width: 600px) {
  .app { padding: 8px 16px; gap: 10px; }
  .inputbar button { padding: 0 10px; }
  header { gap: 10px; }
  .brand small, .status span { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" id="brand">J.A.R.V.I.S<small>LOCAL INTELLIGENCE</small></div>
    <div class="status"><div class="dot" id="dot"></div><span id="model">connecting…</span></div>
    <div class="meters">
      <div class="m-extra">CPU<div class="meter"><i id="cpu"></i></div></div>
      <div class="m-extra">MEM<div class="meter"><i id="mem"></i></div></div>
      <div id="clock">--:--</div>
    </div>
  </header>

  <section class="panel side-left">
    <h2>SUB-AGENTS <span id="agentCount"></span></h2>
    <div id="agents"></div>
  </section>

  <main class="panel">
    <div class="core">
      <div class="reactor" id="reactor">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
        <div class="heart"></div>
        <div class="reactor-label" id="state">STANDBY</div>
      </div>
    </div>
    <div id="chat" aria-live="polite"></div>
    <form class="inputbar" id="form">
      <button type="button" id="mic" title="Talk (local Whisper)" aria-label="Talk">MIC</button>
      <textarea id="input" rows="1" placeholder="Speak or type a command…" autocomplete="off"></textarea>
      <button type="submit">SEND</button>
      <button type="button" id="voice" title="Speak replies aloud" aria-label="Toggle spoken replies">VOICE</button>
    </form>
  </main>

  <section class="panel side-right">
    <h2>ACTIVITY</h2>
    <div id="log"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="box">
    <h3 id="mtitle">AUTHORISATION REQUIRED</h3>
    <p id="mtext"></p>
    <div class="actions">
      <button id="deny">DENY</button>
      <button id="approve">APPROVE</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const H = { "Content-Type": "application/json", "X-Jarvis": "1" };
let speakOn = false;
try { speakOn = localStorage.getItem("jarvis.speak") === "1"; } catch (e) {}
let current = null, currentText = "", busy = false, pendingConfirm = null, userName = "Sir";

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function md(src) {
  const blocks = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, code) => { blocks.push(code); return `\u0000${blocks.length - 1}\u0000`; });
  s = esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/^#{1,6} (.*)$/gm, "<b>$1</b>")
    .replace(/\n/g, "<br>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre>${esc(blocks[+i])}</pre>`);
}
function add(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = role === "jarvis" ? md(text) : esc(text);
  $("chat").appendChild(el);
  $("chat").scrollTop = $("chat").scrollHeight;
  return el;
}
function log(text, cls = "") {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = new Date().toLocaleTimeString([], { hour12: false }) + "  " + text;
  $("log").prepend(el);
  while ($("log").children.length > 200) $("log").lastChild.remove();
}
function setState(s) {
  $("state").textContent = s;
  $("reactor").classList.toggle("busy", s === "PROCESSING" || s === "SPEAKING");
  $("reactor").classList.toggle("listening", s === "LISTENING");
}
function speak(text) {
  if (!speakOn || !("speechSynthesis" in window)) return;
  const clean = text.replace(/```[\s\S]*?```/g, " ").replace(/https?:\/\/\S+/g, "a link").replace(/[*_#`>]/g, "");
  const u = new SpeechSynthesisUtterance(clean);
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find(v => /en-GB/i.test(v.lang) && /male|daniel|george|ryan|arthur/i.test(v.name))
         || voices.find(v => /en-GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
  u.rate = 1.05;
  u.onstart = () => setState("SPEAKING");
  u.onend = () => setState("STANDBY");
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function status() {
  try {
    const s = await (await fetch("/api/status")).json();
    userName = s.user;
    $("dot").classList.toggle("on", s.online);
    $("model").textContent = s.online ? `${s.provider.toUpperCase()} · ${s.model}` : "MODEL OFFLINE — start Ollama";
    if (s.stats && s.stats.cpu !== undefined) { $("cpu").style.width = s.stats.cpu + "%"; $("mem").style.width = s.stats.mem + "%"; }
    if (!$("agents").children.length) {
      $("agentCount").textContent = `· ${s.agents.length}`;
      for (const a of s.agents) {
        const el = document.createElement("div");
        el.className = "agent"; el.id = "ag-" + a.name; el.title = a.description;
        el.innerHTML = `<b>${esc(a.title.toUpperCase())}</b><span></span>`;
        $("agents").appendChild(el);
      }
      if (!$("chat").children.length) add("jarvis", s.online
        ? `Good ${greeting()}, ${s.user}. All ${s.agents.length} sub-agents are standing by. How may I help?`
        : `I can't reach the local model server. ${s.detail}`);
    }
  } catch (e) { $("dot").classList.remove("on"); $("model").textContent = "HUD DISCONNECTED"; }
}
function greeting() { const h = new Date().getHours(); return h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"; }

function connect() {
  const es = new EventSource("/api/events");
  es.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    switch (e.type) {
      case "thinking": setState("PROCESSING"); current = null; currentText = ""; break;
      case "token":
        if (!current) current = add("jarvis", "");
        currentText += e.text; current.innerHTML = md(currentText);
        $("chat").scrollTop = $("chat").scrollHeight; break;
      case "agent_start":
        $("ag-" + e.agent)?.classList.add("active");
        log(`▶ ${e.title}: ${e.task}`, "start"); break;
      case "agent_end":
        $("ag-" + e.agent)?.classList.remove("active");
        log(`✓ ${e.title} done in ${e.seconds}s`, "end"); break;
      case "tool": log(`  ⚙ ${e.agent}.${e.tool} ${JSON.stringify(e.args).slice(0, 140)}`, "tool"); break;
      case "tool_result": if (e.result === "declined") log(`  ✗ ${e.tool} declined`, "warn"); break;
      case "done":
        if (!current) current = add("jarvis", e.reply); else current.innerHTML = md(e.reply);
        busy = false; setState("STANDBY"); speak(e.reply);
        document.querySelectorAll(".agent.active").forEach(a => a.classList.remove("active")); break;
      case "error": add("system", "⚠ " + e.message); busy = false; setState("STANDBY"); break;
      case "confirm":
        pendingConfirm = e.id; $("mtext").textContent = e.prompt; $("modal").classList.add("show");
        $("approve").focus(); log("⚠ awaiting authorisation", "warn"); break;
      case "reminder":
        add("system", "⏰ Reminder: " + e.message);
        speak(`Pardon the interruption, ${userName}. Reminder: ${e.message}`); break;
    }
  };
  es.onerror = () => { $("dot").classList.remove("on"); };
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  add("user", text);
  $("input").value = "";
  const r = await fetch("/api/chat", { method: "POST", headers: H, body: JSON.stringify({ message: text }) });
  if (!r.ok) { busy = false; add("system", "Request failed: " + (await r.json()).error); }
}
async function answer(ok) {
  $("modal").classList.remove("show");
  if (!pendingConfirm) return;
  await fetch("/api/confirm", { method: "POST", headers: H, body: JSON.stringify({ id: pendingConfirm, approved: ok }) });
  log(ok ? "✓ approved" : "✗ denied", ok ? "end" : "warn");
  pendingConfirm = null;
}
$("approve").onclick = () => answer(true);
$("deny").onclick = () => answer(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pendingConfirm) answer(false); });

$("form").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } });
$("voice").classList.toggle("on", speakOn);
$("voice").onclick = () => {
  speakOn = !speakOn; $("voice").classList.toggle("on", speakOn);
  try { localStorage.setItem("jarvis.speak", speakOn ? "1" : "0"); } catch (e) {}
  if (!speakOn && "speechSynthesis" in window) speechSynthesis.cancel();
};

// Microphone: record in the browser, transcribe locally with Whisper on the server.
let rec = null, chunks = [];
$("mic").onclick = async () => {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").classList.remove("on"); setState("PROCESSING");
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      const r = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": blob.type, "X-Jarvis": "1" }, body: blob });
      const data = await r.json();
      setState("STANDBY");
      if (!r.ok) { add("system", "Voice input unavailable: " + data.error); return; }
      if (data.text) send(data.text); else add("system", "I didn't catch that.");
    };
    rec.start(); $("mic").classList.add("on"); setState("LISTENING");
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  } catch (e) { add("system", "Microphone unavailable: " + e.message); }
};

setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }); }, 1000);
setInterval(status, 5000);
status(); connect();
</script>
</body>
</html>
