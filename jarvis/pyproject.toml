[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "1.0.0"
description = "A JARVIS-style personal AI for macOS and Windows that runs on local models with 24 specialist sub-agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # the core runs on the Python standard library alone

[project.optional-dependencies]
system = ["psutil>=5.9"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]
vision = ["Pillow>=10"]
docs = ["pypdf>=4"]
all = ["psutil>=5.9", "faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "Pillow>=10", "pypdf>=4"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["web/*.html", "config.example.toml"]
